<svg xmlns="http://www.w3.org/2000/svg" width="220" height="44" viewBox="0 0 220 44" role="img" aria-label="DimOS Agents">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- agent / robot mark -->
  <g>
    <rect x="3" y="13" width="20" height="16" rx="4" fill="url(#g)"/>
    <circle cx="9" cy="21" r="2.3" fill="#fff"/>
    <circle cx="17" cy="21" r="2.3" fill="#fff"/>
    <rect x="11" y="5" width="4" height="8" rx="2" fill="url(#g)"/>
    <circle cx="13" cy="4" r="2.3" fill="url(#g)"/>
  </g>
  <!-- wordmark -->
  <text x="32" y="27" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="url(#g)">
    DIMOS<tspan dx="1">-AGENTS</tspan>
  </text>
</svg>
