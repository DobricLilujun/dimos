site_name: DimOS
site_description: >-
  Documentation for the new dimOS features: persistent maps, a web console,
  demo exploration, nearby/visual arrival, person recognition, a scene graph
  server, and VLM/segmentation perception — built on top of upstream dimOS,
  with one comparison of the original and the new feature set.
site_url: https://dobriclilujun.github.io/dimos
repo_url: https://github.com/DobricLilujun/dimos
repo_name: DobricLilujun/dimos
edit_uri: edit/learning-branch/docs/
copyright: Dimensional Inc.

docs_dir: docs
site_dir: site

# docs/ is a workspace as well as a page tree; keep the non-pages out.
exclude_docs: |
  node_modules/
  .gitattributes
  logs/
  todo.md
  # agent instructions, not pages
  CLAUDE.md
  # artifacts the executable docs drop next to the page they belong to
  *.db
  *.rrd
  *.mcap
  bla*
  None

# The main site (mkdocs.yml) uses this hook to translate repo-root links and
# to generate the home page from README.md. The GitHub Pages deploy only
# publishes the new-feature docs, which are self-contained; that hook would
# override our docs/index.md (the comparison table) with the README, so we
# omit it here and let docs/index.md be the home page.
# hooks:
#   - misc/mkdocs/hooks.py

# mkdocs serve watches docs/ and the config; the theme lives outside both.
watch:
  - misc/mkdocs

theme:
  name: material
  custom_dir: misc/mkdocs/overrides
  static_templates:
    - llms.txt
  favicon: assets/favicon.png
  logo: assets/dimensional-logo-master-transparent.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # Dark only: one palette entry means material renders no toggle.
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra_css:
  - assets/mkdocs-theme.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # nav lives in docs/.nav.yml (and per-directory .nav.yml files)
  - awesome-nav
  # click a diagram or screenshot to open it full size
  - glightbox:
      auto_caption: false
      skip_classes: [no-lightbox]
  - minify:
      minify_html: true
