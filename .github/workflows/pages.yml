name: Deploy docs (GitHub Pages)

# Deploys the English documentation site (the comparison home + the "new
# features" section) to https://dobriclilujun.github.io/dimos/.
#
# The site is built by mkdocs and then committed to the `gh-pages` branch,
# which GitHub Pages serves as a static site. Publishing through a dedicated
# branch (with a .nojekyll file) avoids the "legacy" build_type race where a
# Jekyll build of the source branch overwrites the freshly deployed artifact.

on:
  push:
    branches: [main, learning-branch]
    paths:
      - "docs/**"
      - "mkdocs.github-pages.yml"
      - "mkdocs.yml"
      - "misc/mkdocs/**"
      - "assets/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  # Manual deploy from the Actions tab.
  workflow_dispatch:

env:
  # The branch GitHub Pages serves. The job pushes the built site here.
  GH_PUBLISH_BRANCH: gh-pages

permissions:
  # contents: write lets the job push the built site to the publish branch.
  contents: write
  pages: write
  id-token: write

# Cancel an in-flight deploy when a newer push supersedes it.
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The docs media (diagrams, screenshots, the favicon) is LFS-tracked.
      # A bare checkout leaves 130-byte pointer files where the images should
      # be, so fetch the media the site actually references before building.
      - name: Fetch the LFS media the site needs
        run: git lfs pull --include="docs/**,assets/**" --exclude=""

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      # --only-group (not --group): the site build imports nothing from the
      # dimos package, so syncing the project drags in the default groups
      # (torch, portaudio, ...) the runner has no reason to carry.
      - name: Install docs dependencies
        run: uv sync --only-group docs

      - name: Build the MkDocs site
        run: |
          .venv/bin/mkdocs build \
            --config-file mkdocs.github-pages.yml \
            --clean \
            --site-dir site

      - name: Verify the build
        # Guard against an empty, broken, or hook-generated home before we
        # publish. The home must be the comparison page, never a generated
        # README landing page.
        run: |
          test -f site/index.html || { echo "No site/index.html - build failed"; exit 1; }
          grep -q "Comparison: original dimOS" site/index.html || {
            echo "HOME IS NOT THE COMPARISON PAGE (a hook may have overridden it)"; exit 1;
          }
          echo "Built pages:"
          find site -name "*.html" | sort | sed 's/^/  /' | head -40

      - name: Prepare the publish branch
        # .nojekyll tells GitHub Pages to serve the built site as static
        # files instead of running a Jekyll build over it.
        run: |
          printf 'Served as a static site by GitHub Pages; do not run Jekyll.\n' > site/.nojekyll

      - name: Publish to the gh-pages branch
        # Push the built site to the publish branch. GitHub Pages serves this
        # branch directly, so the published artifact is not overwritten by a
        # Jekyll "legacy" build of the source branch. The push runs from the
        # checked-out repo (whose credentials the checkout action configured
        # with the GITHUB_TOKEN), so it authenticates without putting the
        # token in a URL. We replace the working tree with the built site so
        # only the site is committed to the publish branch.
        run: |
          set -e
          # Stash the built site aside before wiping the source working tree.
          cp -r site _built
          # Clear the checked-out source working tree (keep the .git dir).
          git rm -rf --quiet . >/dev/null || true
          # Replace the working tree with the built site.
          cp -r _built/. .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy docs: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
          git push --force origin HEAD:${GH_PUBLISH_BRANCH}
