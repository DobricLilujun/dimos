name: Deploy docs (GitHub Pages)

# Publish the MkDocs site to https://dobriclilujun.github.io/dimos
#
# The site is built by the same `mkdocs` toolchain used locally (see
# `mkdocs.github-pages.yml`), so what you get on GitHub Pages is exactly what
# `mkdocs build --config-file mkdocs.github-pages.yml` produces on your
# machine. The build imports nothing from the `dimos` package, so we install
# only the `docs` dependency group — this avoids pulling the heavy runtime
# stack (torch, etc.) into the runner.
#
# Enable Pages in the repository settings:
#   Settings > Pages > Build and deployment > Source > GitHub Actions
# and make sure the "Source branch" is the branch this workflow deploys from
# (learning-branch, or main if you merge the docs there).

on:
  push:
    branches: [main, learning-branch]
    paths:
      - "docs/**"
      - "mkdocs.github-pages.yml"
      - "mkdocs.yml"
      - "misc/mkdocs/**"
      - "assets/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  # Manual deploy from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  # Required by actions/deploy-pages and actions/upload-pages-artifact.
  pages: write
  id-token: write

# Cancel an in-flight deploy when a newer push supersedes it.
concurrency:
  group: deploy-github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    # Only one deploy job runs at a time (also enforced by `concurrency` above).
    environment: github-pages
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The docs media (diagrams, screenshots, the favicon) is LFS-tracked.
      # A bare checkout leaves 130-byte pointer files where the images should
      # be, so fetch the media the site actually references before building.
      - name: Fetch the LFS media the site needs
        run: git lfs pull --include="docs/**,assets/**" --exclude=""

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: true

      # --only-group (not --group): the site build imports nothing from the
      # dimos package, so syncing the project drags in the default groups
      # (torch, portaudio, ...) the runner has no reason to carry.
      - name: Install docs dependencies
        run: uv sync --only-group docs

      - name: Build the MkDocs site
        run: |
          .venv/bin/mkdocs build \
            --config-file mkdocs.github-pages.yml \
            --clean \
            --site-dir site

      - name: Verify the build
        run: |
          test -f site/index.html || { echo "No site/index.html - build failed"; exit 1; }
          echo "Built pages:"
          find site -name "*.html" | sort | sed 's/^/  /' | head -40

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
